        // Logic tăng giảm kích cỡ chữ trực tiếp
        // CỤC BỘ: Hàm trích xuất ID từ link thô dịch chuẩn 100% từ Python sang JS
function lamSachVaTrichXuatId(chuoiGoc) {
    if (!chuoiGoc) return "";
    let s = String(chuoiGoc).trim();
    if (s.includes("com")) {
        let phanTach = s.split("com");
        s = phanTach[phanTach.length - 1];
    }
    
    // Quét tìm chính xác chuỗi mã ID của Google Drive
    let match = s.match(/(1[a-zA-Z0-9-_]{25,45})/);
    if (match && match[1]) {
        let fileId = match[1].trim(); // Lấy phần tử chữ số 1 trong mảng
        
        // Tách chuỗi chuẩn xác bằng chỉ số mảng [0] để tránh xung đột lệnh
        if (fileId.includes("/")) fileId = fileId.split("/")[0].trim();
        if (fileId.includes("?")) fileId = fileId.split("?")[0].trim();
        
        if (!["preview", "download", "google", "presentation"].includes(fileId.toLowerCase())) {
            return fileId;
        }
    }
    return "";
}


// HÀM KÍCH HOẠT TỰ ĐỘNG: Đọc công tắc nạp song song 4 file băm nhỏ từ RAM/GitHub JJJJJJJJ sửa "http://127.0.0.1:5500/";
async function khoiDongTrangXemLoi() {
    try {
        
        let baseUrl = "https://raw.githubusercontent.com/sangankhoai123-lab/ThanhCaAZ/main/";

        const urlParams = new URLSearchParams(window.location.search);
        const songId = urlParams.get('id') || "1";

        // CHÈN THÊM ĐOẠN NÀY VÀO NGAY DƯỚI DÒNG 335 ĐỂ KÍCH HOẠT HỘP ĐEN RÀ SOÁT:
        if (document.getElementById('db-id')) {
            document.getElementById('db-id').textContent = songId;
        }
        // CHÈN ĐÚNG 1 DÒNG NÀY VÀO ĐỂ BẮT ĐẦU NẠP KHO FILE JSON KHI TẢI TRANG
        

        window.KHO_LOI_TONG = {};
        window.THU_VIEN_LINK_DRIVE = {};
        window.THU_VIEN_LINK_PPT = {};
        // Gọi chính xác hàm quan trọng chứa mạch tạo link PDF của bác
        await xuLyMachTaoLinkVaTaiPdf();

        // 1. Tải song song 4 tệp dữ liệu lời bài hát
        const tepLoi = ['dulieu_loi_1.json', 'dulieu_loi_2.json', 'dulieu_loi_3.json', 'dulieu_loi_4.json'];
        const danhSachTaiLoi = tepLoi.map(tep => fetch(`${baseUrl}${tep}`).then(res => res.json()));
        const ketQuaLoi = await Promise.all(danhSachTaiLoi);

        if (Array.isArray(ketQuaLoi)) {
            ketQuaLoi.forEach(loiPart => { if (loiPart) Object.assign(window.KHO_LOI_TONG, loiPart); });
        }

        // 2. Tải kho liên kết tài liệu từ Drive
        // 2. Tải kho liên kết tài liệu từ Drive (Bổ sung mạch báo lỗi lên Hộp Đen)
        try { 
            let resPdf = await fetch(`${baseUrl}thu_vien_link_toan_bo.json`);
            if(!resPdf.ok) {
                if(document.getElementById('debugContent')) document.getElementById('debugContent').innerHTML += `<br><span style="color:#ff4d4d">❌ Lỗi PDF: HTTP ${resPdf.status}</span>`;
            }
            window.THU_VIEN_LINK_DRIVE = await resPdf.json(); 
        } catch (e) {
            if(document.getElementById('debugContent')) document.getElementById('debugContent').innerHTML += `<br><span style="color:#ff4d4d">❌ Lỗi PDF ngầm: ${e.message}</span>`;
        }

        try { 
            let resPpt = await fetch(`${baseUrl}thu_vien_link_ppt.json`);
            if(!resPpt.ok) {
                if(document.getElementById('debugContent')) document.getElementById('debugContent').innerHTML += `<br><span style="color:#ff4d4d">❌ Lỗi PPT: HTTP ${resPpt.status}</span>`;
            }
            window.THU_VIEN_LINK_PPT = await resPpt.json(); 
        } catch (e) {
            if(document.getElementById('debugContent')) document.getElementById('debugContent').innerHTML += `<br><span style="color:#ff4d4d">❌ Lỗi PPT ngầm: ${e.message}</span>`;
        }

        // 3. Đọc và bóc tách nội dung văn bản bài hát từ RAM
        let doanTextTho = window.KHO_LOI_TONG[songId];
        if (!doanTextTho) {

            document.getElementById("txt-loi").innerText = `Không tìm thấy nội dung bài hát tương ứng với mã số ID: ${songId}`;
            return; 
        }
        
        let tuaBai = "";
        let tacGia = "Chưa rõ";
        let loiBaiHat = "";

        if (doanTextTho.includes('_')) {

            tuaBai = phanTach[0] ? phanTach[0].trim() : "";
            let phanConLai = phanTach.slice(1).join('_');
            let cacDong = phanConLai.split('\n');
            tacGia = cacDong[0] ? cacDong[0].trim() : "Chưa rõ";
            loiBaiHat = cacDong.slice(1).join('\n').trim();
        } else {
            let cacDong = doanTextTho.split('\n');
            tuaBai = cacDong[0] ? cacDong[0].trim() : "";
            loiBaiHat = cacDong.slice(1).join('\n').trim();

        document.getElementById("txt-id").innerText = `BÀI SỐ: ${songId}`;

        // 5. Trích xuất mã ID Drive sạch để cấu hình link cho 3 nút bấm lớn
        let rawPdf = window.THU_VIEN_LINK_DRIVE[songId] || "";
        let rawPpt = window.THU_VIEN_LINK_PPT[songId] || "";

        let idCleanPdf = lamSachVaTrichXuatId(rawPdf);
        let idCleanPpt = lamSachVaTrichXuatId(rawPpt);
        // Kích hoạt nhà máy bóc tách link và đẩy thông tin trực quan lên Hộp Đen của bác
        thucHienPhanTangVaLamSachLink(songId, rawPdf, rawPpt);


        // Đấu nối hoạt động kích hoạt mở link khi bấm nút (Có chữ window. để gọi biến liên tầng)
        document.getElementById('btn-xem').onclick = () => { 
            if (window.linkPdfXemDuoc) window.open(window.linkPdfXemDuoc, '_blank'); 
            else alert('Bài này chưa có bản nhạc PDF để xem!'); 
        };
        document.getElementById('btn-tai-pdf').onclick = () => { 
            if (window.linkPdfTaiVe) window.open(window.linkPdfTaiVe, '_blank'); 
            else alert('Chưa có file PDF để tải!'); 
        };
        document.getElementById('btn-tai-ppt').onclick = () => { 
            if (window.linkPptTaiDuoc) window.open(window.linkPptTaiDuoc, '_blank'); 
            else alert('Bài này chưa có file PowerPoint PPT để tải!'); 
        };


    } catch (error) {
        console.error("Lỗi:", error);
        document.getElementById("txt-tua").innerText = "Lỗi kết nối dữ liệu";
    }
}


// Lắng nghe lệnh kích hoạt ngay khi trình duyệt dựng xong khung HTML
window.addEventListener('DOMContentLoaded', khoiDongTrangXemLoi);
