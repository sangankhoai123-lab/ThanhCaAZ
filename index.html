<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Thánh Ca</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fdfefe; color: #333; height: 100vh; overflow: hidden; }
        
        .app-container { display: flex; height: 100vh; width: 100vw; }
        
        /* CỘT TRÁI: Tìm kiếm & Giao diện danh sách kết quả */
        .sidebar { width: 450px; min-width: 380px; background: #f4f7f9; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; height: 100%; }
        
        /* Phần banner màu xanh phía trên */
        .header-banner { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 30px 20px; text-align: center; position: relative; }
        .music-icon { font-size: 28px; margin-bottom: 5px; display: inline-block; }
        .header-banner h1 { font-size: 22px; font-weight: bold; margin-bottom: 5px; letter-spacing: 0.5px; }
        .header-banner h1 span { color: #f39c12; font-style: italic; }
        .subtitle { font-size: 12px; color: #cbd5e1; margin-bottom: 5px; }
        
        /* Ô tìm kiếm bo góc đổ bóng đè lên viền banner */
        .search-wrapper { padding: 0 20px; margin-top: -20px; margin-bottom: 15px; position: relative; z-index: 10; }
        .search-box-container { background: white; display: flex; align-items: center; padding: 12px 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .search-icon { color: #94a3b8; margin-right: 10px; font-size: 16px; }
        #search-box { width: 100%; border: none; outline: none; font-size: 16px; color: #334155; }
        
        /* Thanh công cụ: Chỉnh cỡ chữ */
        .toolbar { padding: 5px 20px; display: flex; justify-content: flex-end; align-items: center; margin-bottom: 10px; }
        .font-controller { display: flex; align-items: center; background: white; border: 1px solid #e2e8f0; border-radius: 6px; padding: 2px; }
        .font-btn { width: 24px; height: 24px; border: none; background: #f1f5f9; color: #64748b; font-weight: bold; font-size: 14px; cursor: pointer; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
        .font-btn:hover { background: #e2e8f0; }
        .font-size-val { font-size: 12px; font-weight: bold; color: #475569; margin: 0 10px; min-width: 16px; text-align: center; }
        
        /* Vùng chứa danh sách cuộn tự do */
        .results-container { flex: 1; overflow-y: auto; padding: 0 20px 20px 20px; }
        
        /* Tiêu đề nhóm tìm kiếm */
        .group-header { font-size: 14px; color: #1e293b; font-weight: bold; margin: 10px 0 8px 5px; }
        
        /* Kiểu dáng các mục bài hát chuẩn theo ảnh mẫu */
        .list-item { background: white; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 8px; display: flex; align-items: center; padding: 12px; cursor: pointer; transition: all 0.2s; position: relative; }
        .list-item:hover { border-color: #cbd5e1; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .list-item.active { border-color: #3b82f6; background: #f0f7ff; }
        
        /* Khối vuông chứa mã số ID bên trái */
        .item-id { width: 45px; font-size: 14px; color: #1e3c72; font-weight: bold; text-align: center; border-right: 1px solid #f1f5f9; margin-right: 12px; padding-right: 4px; }
        .item-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .item-title { font-size: 15px; font-weight: 600; color: #1e293b; }
        .item-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #64748b; font-weight: 500; }
        
        /* Nhãn xanh báo loại khớp dữ liệu */
        .badge-match { background: #dcfce7; color: #15803d; font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        
        /* Icon xem bài hát bên phải */
        .view-icon { font-size: 18px; margin-left: 10px; color: #64748b; }

        /* CỘT PHẢI: Xem nội dung lời bài hát */
        .content-panel { flex: 1; background: #fafbfc; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; }
        .back-btn { display: none; background: #475569; color: white; padding: 8px 16px; border-radius: 6px; font-size: 14px; margin-bottom: 20px; cursor: pointer; font-weight: bold; width: fit-content; }
        #detail-title { font-size: 26px; color: #1e3c72; margin-bottom: 6px; font-weight: bold; }
        #detail-author { font-size: 14px; color: #64748b; font-style: italic; margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; }
        #detail-content { line-height: 1.8; white-space: pre-line; color: #334155; transition: font-size 0.1s; }
        .placeholder-text { margin: auto; color: #94a3b8; font-size: 15px; text-align: center; line-height: 1.6; }

        /* TỐI ƯU ĐIỆN THOẠI (Responsive) */
        @media (max-width: 767px) {
            .sidebar { width: 100%; }
            .content-panel { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: white; padding: 20px; z-index: 100; }
            .back-btn { display: block; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Cột Bên Trái -->
        <div class="sidebar" id="sidebar-view">
            <div class="header-banner">
                <span class="music-icon">🎵</span>
                <h1>Web <span>Thánh Ca</span></h1>
                <div class="subtitle">Tìm kiếm bài hát phục vụ Ca Đoàn</div>
            </div>
            
            <div class="search-wrapper">
                <div class="search-box-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-box" placeholder="Nhập từ khóa hoặc mã viết tắt..." autocomplete="off">
                </div>
            </div>
            
            <div class="toolbar">
                <div class="font-controller">
                    <button class="font-btn" onclick="doiCoChu(-1)">-</button>
                    <div class="font-size-val" id="font-size-display">18</div>
                    <button class="font-btn" onclick="doiCoChu(1)">+</button>
                </div>
            </div>
            
            <div class="results-container" id="results"></div>
        </div>
        
        <!-- Cột Bên Phải -->
        <div class="content-panel" id="content-view">
            <div class="back-btn" onclick="quayLaiDanhSach()">⬅ QUAY LẠI</div>
            <div id="has-data" style="display: none;">
                <h2 id="detail-title"></h2>
                <div id="detail-author"></div>
                <div id="detail-content"></div>
            </div>
            <div id="no-data" class="placeholder-text">
                🎵 <br><br> Chọn một bài hát từ danh sách để xem lời bài hát chi tiết
            </div>
        </div>
    </div>
    <!-- Gọi chính xác file script_moi.js để chống kẹt cache trình duyệt -->
    <script src="script_2.js"></script>
</body>
</html>
